<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Phone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 스마트폰 외형 (아이폰 스타일) */
        .phone {
            width: 360px;
            height: 720px;
            background-color: #000;
            border-radius: 50px;
            padding: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 3px rgba(255,255,255,0.4);
            position: relative;
        }

        /* 화면 영역 */
        .screen {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 상단 다이나믹 아일랜드 / 노치 */
        .notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 28px;
            background-color: #000;
            border-radius: 20px;
            z-index: 100;
        }

        /* 상단 상태바 (시계, 배터리) */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 14px 25px 0 25px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            z-index: 90;
        }

        /* 시계 위젯 */
        .widget-clock {
            margin: 40px 20px 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .widget-clock .time { font-size: 42px; font-weight: 700; }
        .widget-clock .date { font-size: 14px; opacity: 0.8; margin-top: 5px; }

        /* 앱 그리드 */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 15px 20px;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .app:active { transform: scale(0.9); }

        .app-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.85);
        }

        .app-name {
            color: white;
            font-size: 11px;
            margin-top: 6px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 하단 독(Dock) 영역 */
        .dock {
            margin: 15px 15px 20px 15px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="notch"></div>
        
        <div class="screen">
            <!-- 상단 상태바 -->
            <div class="status-bar">
                <span>9:41</span>
                <span>📶 🔋</span>
            </div>

            <!-- 시계 위젯 -->
            <div class="widget-clock">
                <div class="time" id="clock">09:41</div>
                <div class="date">10월 24일 토요일</div>
            </div>

            <!-- 메인 앱들 -->
            <div class="app-grid">
                <div class="app" onclick="alert('📷 카메라인 척하는 기능!')"><div class="app-icon">📷</div><span class="app-name">카메라</span></div>
                <div class="app" onclick="alert('🖼️ 갤러리 열기!')"><div class="app-icon">🖼️</div><span class="app-name">갤러리</span></div>
                <div class="app" onclick="alert('🎵 음악 재생 중~')"><div class="app-icon">🎵</div><span class="app-name">음악</span></div>
                <div class="app" onclick="alert('⚙️ 설정 화면')"><div class="app-icon">⚙️</div><span class="app-name">설정</span></div>
                <div class="app" onclick="alert('💬 메시지 0건')"><div class="app-icon">💬</div><span class="app-name">메시지</span></div>
                <div class="app" onclick="alert('⭐ 나만의 특별한 앱')"><div class="app-icon">⭐</div><span class="app-name">My App</span></div>
            </div>

            <!-- 하단 고정 독 -->
            <div class="dock">
                <div class="app" onclick="alert('📞 전화 연결')"><div class="app-icon">📞</div></div>
                <div class="app" onclick="alert('🌐 인터넷 접속')"><div class="app-icon">🌐</div></div>
                <div class="app" onclick="alert('✉️ 이메일함')"><div class="app-icon">✉️</div></div>
                <div class="app" onclick="alert('🎧 플레이리스트')"><div class="app-icon">🎧</div></div>
            </div>
        </div>
    </div>

    <script>
        // 현재 시간 실시간 업데이트 기능
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
